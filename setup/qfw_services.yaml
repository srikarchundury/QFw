services:
  - name: nwqsim
    module: svc_nwqsim_qpm
    load-modules: svc_nwqsim_qpm,api_launcher
    agent-prefix: qpm_nwqsim
    target: group1-head
    assigned-hosts: group1
    assigned-hosts-env: QFW_QPM_ASSIGNED_HOSTS

  - name: tnqvm
    module: svc_tnqvm_qpm
    load-modules: svc_tnqvm_qpm,api_launcher
    agent-prefix: qpm_tnqvm
    target: group1-head
    assigned-hosts: group1
    assigned-hosts-env: QFW_QPM_ASSIGNED_HOSTS

  - name: qiskitaer
    module: svc_qiskitaer_qpm
    load-modules: svc_qiskitaer_qpm,api_launcher
    agent-prefix: qpm_qiskitaer
    target: group1-head
    assigned-hosts: group1
    assigned-hosts-env: QFW_QPM_ASSIGNED_HOSTS

  - name: qtensor
    module: svc_qtensor_qpm
    load-modules: svc_qtensor_qpm,api_launcher
    agent-prefix: qpm_qtensor
    target: group1-head
    assigned-hosts: group1
    assigned-hosts-env: QFW_QPM_ASSIGNED_HOSTS

  - name: ionq
    module: svc_ionq_qpm
    load-modules: svc_ionq_qpm,api_launcher
    agent-prefix: qpm_ionq
    target: group1-head

  - name: ibmq
    module: svc_ibmq_qpm
    load-modules: svc_ibmq_qpm,api_launcher
    agent-prefix: qpm_ibmq
    target: group1-head

  # iqm-ornl-20q / shim-ornl-20q (upstream's IQM ORNL-20q demo services) are
  # intentionally not registered here: we have no IQM hardware/host-group
  # config in this deployment, and qfw_setup.py waits for every registered
  # service to report started before continuing — a broken/unconfigured
  # service here blocks every backend's startup, not just IQM's.
